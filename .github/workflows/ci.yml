name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Migrate database
        run: alembic upgrade head
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
