[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ant-pvg-research-observatory"
version = "0.1.0.dev0"
description = "Local-first research observatory for analytic number theory and Prime-Valuation Geometry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ant_pvg_observatory"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "server.py",
  "static",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
